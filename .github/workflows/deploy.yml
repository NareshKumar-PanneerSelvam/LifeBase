name: LifeBase CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'lifebase-server/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'lifebase-server/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lifebase-server

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run Pytest suite
      env:
        DATABASE_URL: sqlite+aiosqlite:///:memory:
        SECRET_KEY: test_secret_key_running_on_github_actions_ci_cd
        ENVIRONMENT: testing
      run: |
        python -m pytest -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          echo "=== 1. Navigating to project workspace ==="
          cd /home/ubuntu/LifeBase
          
          echo "=== 2. Pulling latest code changes ==="
          git pull origin main
          
          echo "=== 3. Re-building and booting Docker containers ==="
          cd lifebase-server
          docker compose -f docker-compose.yml up --build -d
          
          echo "=== 4. Cleaning up dangling Docker resources ==="
          docker image prune -f
          
          echo "=== Deploy Completed Successfully! ==="
